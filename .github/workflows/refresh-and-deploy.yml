name: Refresh data & deploy

# Recomputes the top-5 ranking and publishes the site to GitHub Pages.
#  - schedule: every 30 min during US market hours (Mon-Fri) + once overnight
#  - workflow_dispatch: the "Recompute ranking" button on the dashboard links here
#  - push to main: redeploy after code changes
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # 13:00-21:30 UTC ~ US session (EST/EDT)
    - cron: "17 2 * * *"           # overnight run so weekend data still settles
  workflow_dispatch:
    inputs:
      provider:
        description: "Data provider"
        type: choice
        options: [auto, moomoo, yahoo]
        default: auto
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Repo variable DATA_PROVIDER (Settings > Secrets and variables > Actions > Variables):
  #   yahoo  (default) - free, runs on GitHub's servers
  #   moomoo           - runs on YOUR self-hosted runner where moomoo OpenD is logged in
  PROVIDER: ${{ github.event.inputs.provider != 'auto' && github.event.inputs.provider || vars.DATA_PROVIDER || 'yahoo' }}

jobs:
  build:
    # moomoo needs OpenD, which only exists on your own machine -> self-hosted runner.
    runs-on: ${{ (github.event.inputs.provider != 'auto' && github.event.inputs.provider || vars.DATA_PROVIDER || 'yahoo') == 'moomoo' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (GitHub-hosted only; self-hosted uses your installed Python)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install moomoo SDK (moomoo path only)
        if: env.PROVIDER == 'moomoo'
        run: python -m pip install -r requirements-moomoo.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Recompute ranking
        id: refresh
        continue-on-error: true
        run: python scripts/refresh.py --provider ${{ env.PROVIDER }}

      - name: Keep last good data if the refresh failed
        if: steps.refresh.outcome == 'failure'
        run: python scripts/keep_last_good.py "${{ steps.pages.outputs.base_url }}/data/dashboard.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy dashboard

# Publishes the site with the latest moomoo MCP snapshot from the `moomoo-data` branch.
# The snapshot is produced by the Claude scheduled task "moomoo MCP dashboard refresh"
# (on demand, plus your weekly schedule), which dispatches this workflow when it's done.
# Nothing here fetches market data itself.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Load latest moomoo snapshot
        id: load
        continue-on-error: true
        run: python scripts/load_moomoo_data.py

      - name: Keep the live data if the snapshot couldn't be loaded
        if: steps.load.outcome == 'failure'
        run: python scripts/keep_last_good.py "${{ steps.pages.outputs.base_url }}/data/dashboard.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

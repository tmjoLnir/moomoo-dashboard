name: Refresh data & deploy

# Builds the ranking and publishes the site to GitHub Pages. Always runs on
# GitHub-hosted runners, so it can never get stuck waiting for your PC.
#
# Data source, decided on every run:
#   1. fresh moomoo ranking on the `moomoo-data` branch (< 45 min old), published by
#      "Refresh moomoo data (self-hosted)" on your PC, else
#   2. recompute with Yahoo Finance (free fallback), else
#   3. re-publish whatever is live now (keep_last_good.py).
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # 13:00-21:30 UTC ~ US session (EST/EDT)
    - cron: "17 2 * * *"           # overnight run so weekend data still settles
  workflow_dispatch:
    inputs:
      source:
        description: "auto = moomoo if fresh, else Yahoo; yahoo = always recompute with Yahoo"
        type: choice
        options: [auto, yahoo]
        default: auto
  workflow_run:                    # deploy right after each successful moomoo refresh
    workflows: ["Refresh moomoo data (self-hosted)"]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Safe at workflow level now: every job here runs on GitHub-hosted runners, so a
# queued run always starts within seconds and can't block later ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Use fresh moomoo data if available
        id: moomoo
        if: inputs.source != 'yahoo'
        run: python scripts/use_moomoo_data.py --max-age-min 45

      - name: Recompute ranking with Yahoo
        id: refresh
        if: steps.moomoo.outputs.used != 'true'
        continue-on-error: true
        run: python scripts/refresh.py --provider yahoo

      - name: Keep last good data if the refresh failed
        if: steps.refresh.outcome == 'failure'
        run: python scripts/keep_last_good.py "${{ steps.pages.outputs.base_url }}/data/dashboard.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
